name: CI/CD Pipeline - ms-vehiculos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================================
  # FASE 1: Pruebas Unitarias y Cobertura (IE2)
  # ========================================================
  unit-tests:
    name: Pruebas Unitarias y JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias con JUnit
        run: mvn clean test

      - name: Subir reporte de cobertura JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ========================================================
  # FASE 2: Escaneo de Seguridad y Bloqueo (IE3)
  # ========================================================
  security-scan:
    name: Analisis de Seguridad con Snyk
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Instalar y ejecutar escaneo de Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ========================================================
  # FASE 3: Contenerización y Validación Docker (IE1 / IE5)
  # ========================================================
  docker-build:
    name: Construccion y Validacion Docker
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker Multi-Stage
        run: |
          docker build -t ms-vehiculos:${{ github.sha }} .
          docker tag ms-vehiculos:${{ github.sha }} ms-vehiculos:latest

      - name: Probar orquestacion con Docker Compose en runner
        run: |
          docker compose up -d --build
          sleep 20
          docker compose ps
          docker compose down

  # ========================================================
  # FASE 4: Despliegue en la Nube (AWS EC2 / Cloud Simulado) (IE4)
  # ========================================================
  deploy:
    name: Despliegue Continuo (CD)
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21 para empaquetado final
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Generar artefacto .jar de produccion
        run: mvn clean package -DskipTests

      - name: Desplegar a AWS EC2 via SSH
        if: env.EC2_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: 'target/cl-matiivilla-vehiculos-0.0.1-SNAPSHOT.jar'
          target: '/home/${{ secrets.EC2_USER }}/micros'
          strip_components: 1

      - name: Reiniciar servicio systemd en AWS EC2
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            sudo systemctl restart ms-vehiculos
            sudo systemctl status ms-vehiculos --no-pager

      - name: Notificar despliegue exitoso
        run: echo "Despliegue a produccion completado con exito para el commit ${{ github.sha }}."